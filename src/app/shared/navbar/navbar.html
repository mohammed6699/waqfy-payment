<nav class="bg-white border-gray-200 py-2.5 dark:bg-gray-900">
  <div class="flex flex-wrap items-center justify-between max-w-screen-xl px-4 mx-auto">

    <!-- Logo (always visible) -->
    <a [routerLink]="'/home'" class="flex items-center w-14">
      <img src="assets/images/logo.svg" class="w-full h-full" alt="Waqfy" />
    </a>

    <!-- Hamburger (mobile only) -->
    <button
      type="button"
      class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()">
      @if (!isMenuOpen) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      }
    </button>

    <!-- Menu: collapsible on mobile, row on desktop -->
    <div
      id="mobile-menu"
      class="w-full mt-3 lg:mt-0 lg:flex lg:flex-1 lg:w-auto lg:items-center lg:justify-between lg:ms-8"
      [class.hidden]="!isMenuOpen">

      <!-- Links -->
      <ul class="flex flex-col lg:flex-row lg:items-center font-medium lg:gap-8">
        <li>
          <a href="#" (click)="isMenuOpen = false"
            class="block py-2 px-3 text-white bg-purple-700 rounded lg:bg-transparent lg:text-purple-700 lg:p-0 dark:text-white"
            aria-current="page">Home</a>
        </li>
        <li>
          <a href="#" (click)="isMenuOpen = false"
            class="block py-2 px-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-purple-700 lg:p-0 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700">About</a>
        </li>
        <li>
          <a href="#" (click)="isMenuOpen = false"
            class="block py-2 px-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-purple-700 lg:p-0 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700">waqfy products</a>
        </li>
        <li>
          <a href="#" (click)="isMenuOpen = false"
            class="block py-2 px-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-purple-700 lg:p-0 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700">special</a>
        </li>
      </ul>

      <!-- Actions -->
      <div class="flex flex-wrap items-center gap-3 mt-4 lg:mt-0">
        <button type="button"><img src="assets/images/search.svg" alt="Search" /></button>
        <button type="button"><img src="assets/images/profile.svg" alt="Profile" /></button>
        <button type="button"><img src="assets/images/cart.svg" alt="Cart" /></button>

        <button type="button"
          (click)="changeDirection(currentLanguage === 'en' ? 'ar' : 'en')">
          <div class="flex items-center">
            <span class="text-black">
              {{ currentLanguage === 'ar' ? 'English' : 'عربي' }}
            </span>
            <img src="assets/images/Leading.svg" alt="" />
          </div>
        </button>

        <button type="button"
          class="bg-black text-white px-6 py-1 rounded-lg font-bold hover:bg-green-800 cursor-pointer">
          sign
        </button>
      </div>
    </div>
  </div>
</nav>
