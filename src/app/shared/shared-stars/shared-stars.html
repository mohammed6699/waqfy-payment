<div class="flex gap-1" role="radiogroup" aria-label="التقييم" (mouseleave)="hovered.set(0)">
    @for (star of stars(); track star) {
    <button type="button" role="radio" [attr.aria-checked]="star === value()" [attr.aria-label]="star + ' من ' + max()"
        [disabled]="readonly()" (click)="select(star)" (mouseenter)="hover(star)"
        class="transition-colors disabled:cursor-default"
        [class]="star <= display() ? 'text-amber-400' : 'text-gray-300'">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="currentColor" aria-hidden="true">
            <path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.1L12 17.6 5.7 21.3l1.7-7.1L2 9.5l7.1-.6L12 2z" />
        </svg>
    </button>
    }
</div>
